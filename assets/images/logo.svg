<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Modern Rustic Apple + Donut Logo -->
  <defs>
    <linearGradient id="appleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C23B22;stop-opacity:1" /> <!-- Apple Red -->
      <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" /> <!-- Soft Brown -->
    </linearGradient>
  </defs>
  
  <!-- Apple Body -->
  <path d="M50 20 C40 20, 25 25, 25 45 C25 65, 35 85, 50 85 C65 85, 75 65, 75 45 C75 25, 60 20, 50 20" fill="url(#appleGradient)" />
  
  <!-- Stem -->
  <path d="M50 20 C50 10, 55 5, 60 5" fill="none" stroke="#5C4033" stroke-width="4" stroke-linecap="round" />
  
  <!-- Leaf -->
  <path d="M50 15 C55 10, 65 10, 65 20 C60 25, 55 20, 50 15" fill="#4A5D23" />
  
  <!-- Donut Hole / Core -->
  <circle cx="50" cy="50" r="12" fill="#F5F5DC" /> <!-- Cream -->
  
  <!-- Donut "Sprinkles" or Cinnamon texture -->
  <g fill="#D2691E"> <!-- Cinnamon -->
    <rect x="48" y="42" width="4" height="1" rx="0.5" transform="rotate(45 48 42)" />
    <rect x="54" y="45" width="4" height="1" rx="0.5" transform="rotate(-30 54 45)" />
    <rect x="45" y="52" width="4" height="1" rx="0.5" transform="rotate(60 45 52)" />
    <rect x="52" y="56" width="4" height="1" rx="0.5" transform="rotate(-15 52 56)" />
  </g>
</svg>
