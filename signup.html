<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us | Signup | Cider Donut & Apple Orchard Bakery</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#8B4513',
                        secondary: '#D35400',
                        accent: '#A52A2A',
                        cream: '#FDF5E6',
                        beige: '#F5F5DC',
                        charcoal: '#333333',
                        gold: '#D4AF37',
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
</head>
<body class="bg-cream text-charcoal dark:bg-zinc-900 dark:text-zinc-100 transition-colors duration-300 min-h-screen flex flex-col">


    <!-- MAIN CONTENT -->
    <main class="flex-grow flex items-center justify-center pt-24 pb-20 px-4 relative overflow-hidden">
        <!-- Decorative Background elements -->
        <div class="absolute inset-0 z-0 opacity-10 pointer-events-none">
            <img src="https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&q=80&w=1200" alt="Signup Backdrop" class="w-full h-full object-cover">
        </div>
        <div class="max-w-md w-full relative z-10">
            <!-- UTILITY TOGGLES (Above Card on Mobile/Tab, Top Corner on Desktop) -->
            <div class="flex justify-end items-center space-x-3 mb-8 px-2 lg:fixed lg:top-10 lg:right-10 lg:z-50 lg:mb-0 lg:px-0">
                 <button id="theme-toggle" class="w-12 h-12 rounded-2xl bg-white/40 dark:bg-zinc-800/40 backdrop-blur-xl border border-white/30 shadow-xl flex items-center justify-center hover:scale-110 hover:shadow-2xl active:scale-95 transition-all text-charcoal dark:text-gold group">
                    <i class="fas fa-moon group-hover:rotate-12 transition-transform"></i>
                </button>
                <button id="rtl-toggle" class="h-12 px-6 rounded-2xl bg-white/40 dark:bg-zinc-800/40 backdrop-blur-xl border border-white/30 shadow-xl font-bold text-xs hover:scale-110 hover:shadow-2xl active:scale-95 transition-all text-charcoal dark:text-gold uppercase tracking-widest">RTL</button>
            </div>

            <!-- Signup Card -->
            <div class="glass p-10 rounded-[3rem] shadow-2xl border border-white/30 backdrop-blur-xl bg-white/40 dark:bg-zinc-800/40 reveal">
                <div class="text-center mb-10">
                    <a href="index.html" class="inline-flex items-center space-x-3 mb-8 group">
                        <img src="assets/images/logo.svg" alt="Orchard Bakery" class="h-12 w-auto group-hover:scale-110 transition-transform duration-300">
                        <span class="font-serif text-3xl font-bold text-primary dark:text-gold tracking-tight">Orchard Bakery</span>
                    </a>
                    <h2 class="text-xs uppercase tracking-[0.3em] font-black text-gray-400 dark:text-zinc-500">Create Account</h2>
                </div>

                <form class="space-y-4">
                    <div class="space-y-2">
                        <label class="text-xs font-bold uppercase tracking-widest opacity-60">First Name</label>
                        <input type="text" placeholder="John" class="w-full px-4 py-3 bg-white/50 dark:bg-zinc-900 border border-gray-200 dark:border-zinc-700 rounded-xl focus:outline-none focus:border-primary transition-all">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold uppercase tracking-widest opacity-60">Last Name</label>
                        <input type="text" placeholder="Doe" class="w-full px-4 py-3 bg-white/50 dark:bg-zinc-900 border border-gray-200 dark:border-zinc-700 rounded-xl focus:outline-none focus:border-primary transition-all">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold uppercase tracking-widest opacity-60">Email Address</label>
                        <input type="email" placeholder="john@email.com" class="w-full px-4 py-3 bg-white/50 dark:bg-zinc-900 border border-gray-200 dark:border-zinc-700 rounded-xl focus:outline-none focus:border-primary transition-all">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold uppercase tracking-widest opacity-60">Password</label>
                        <div class="relative">
                            <input type="password" placeholder="••••••••" class="password-input w-full pl-4 pr-12 py-3 bg-white/50 dark:bg-zinc-900 border border-gray-200 dark:border-zinc-700 rounded-xl focus:outline-none focus:border-primary transition-all">
                            <button type="button" class="password-toggle absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary transition-colors">
                                <i class="far fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold uppercase tracking-widest opacity-60">Confirm Password</label>
                        <div class="relative">
                            <input type="password" placeholder="••••••••" class="password-input w-full pl-4 pr-12 py-3 bg-white/50 dark:bg-zinc-900 border border-gray-200 dark:border-zinc-700 rounded-xl focus:outline-none focus:border-primary transition-all">
                            <button type="button" class="password-toggle absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary transition-colors">
                                <i class="far fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="flex items-start space-x-2 pt-2">
                        <input type="checkbox" id="terms" class="mt-1 w-4 h-4 rounded border-gray-300 text-primary focus:ring-primary">
                        <label for="terms" class="text-xs opacity-70">I agree to the <a href="#" class="font-bold underline">Terms of Service</a> and <a href="#" class="font-bold underline">Privacy Policy</a>.</label>
                    </div>

                    <button class="w-full py-4 bg-secondary text-white rounded-xl font-bold text-lg hover:bg-opacity-90 transition-all shadow-xl mt-4">Create Account</button>
                </form>

                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200 dark:border-zinc-700"></div></div>
                    <div class="relative flex justify-center text-[10px] uppercase font-bold text-gray-400 bg-transparent px-2"><span>Or Signup with</span></div>
                </div>

                <div class="flex justify-center space-x-4">
                    <button class="w-12 h-12 bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-700 rounded-xl hover:bg-gray-50 transition-all flex items-center justify-center shadow-sm"><i class="fab fa-google text-red-500"></i></button>
                    <button class="w-12 h-12 bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-700 rounded-xl hover:bg-gray-50 transition-all flex items-center justify-center shadow-sm"><i class="fab fa-facebook-f text-blue-600"></i></button>
                    <button class="w-12 h-12 bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-700 rounded-xl hover:bg-gray-50 transition-all flex items-center justify-center shadow-sm"><i class="fab fa-apple text-charcoal dark:text-white"></i></button>
                </div>

                <p class="text-center mt-8 text-sm text-gray-500">
                    Already have an account? <a href="login.html" class="text-secondary font-bold hover:underline">Sign In</a>
                </p>
            </div>
        </div>
    </main>


    <script src="assets/js/main.js"></script>
</body>
</html>
